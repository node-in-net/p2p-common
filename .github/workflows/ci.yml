name: CI

# Only `nodeinnet-p2p` is checked here. It is the one crate that builds
# standalone — `p2p-node` and `client-core` resolve `common` and `client-config`
# from a consuming workspace, so they are covered by the CI of the projects that
# embed this repository.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  protocol:
    name: nodeinnet-p2p (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nodeinnet-p2p

      - name: Format
        run: cargo fmt --manifest-path nodeinnet-p2p/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path nodeinnet-p2p/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path nodeinnet-p2p/Cargo.toml

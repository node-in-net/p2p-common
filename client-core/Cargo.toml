[package]
name = "client-core"
version = "0.1.286"
edition = "2024"
description = "P2P client: WebRTC transport, signalling-server WebSocket, peer orchestration, chunked file transfer and node.in.net authentication"
license = "MIT OR Apache-2.0"
repository = "https://github.com/node-in-net/p2p-common"
publish = false

[dependencies]
nodeinnet-p2p = { workspace = true }
p2p-node = { workspace = true, default-features = false }
client-config = { workspace = true }

tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
webrtc = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
uuid = { version = "1.6", features = ["v4"] }
log = "0.4"
async-trait = "0.1"
bytes.workspace = true
bson = { version = "3.1.0", features = ["serde"] }
openh264 = "0.4"
openh264-sys2 = "0.4"
rtp = "0.6"
base64 = "0.21"
yuv = { version = "0.8.16", optional = true }

[features]
default = ["feature-power", "simd-yuv"]
feature-power = []
simd-yuv = ["dep:yuv"]
